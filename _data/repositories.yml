# Self-contained cards rendered by _pages/repositories.md.
# These do NOT depend on any external service, so they always render.
# To add a repo: copy a block below and edit name / url / lang / desc / tags.
#
# `tags` are optional and purely cosmetic. Their colours come from
# _data/project_tags.yml (tag -> family) and assets/css/main.scss (family -> colour),
# which is the same vocabulary the project cards use.
repo_cards:
  - name: Lichess-Essentials
    url: https://github.com/spearb0lt/Lichess-Essentials

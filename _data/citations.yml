# git add _data/citations.yml
# git commit -m "Update Google Scholar citations"
# git push




# 1. Adding more papers — where, and does the script handle it?
# a) _bibliography/papers.bib — add google_scholar_id={THE_ID} to that paper's entry. This is what makes the badge appear at all and links it to the right paper. (THE_ID is the citation_for_view=…:THE_ID suffix in the paper's Scholar URL.)

# b) bin/update_citations_local.py → MANUAL_PUBLICATIONS — add a line for it.
# Why (b)? The script has two modes:

# Live scrape succeeds → it reads your entire profile and writes all papers automatically. In that case it handles everything, no manual list needed.
# Live scrape blocked (the normal case for you — Google 403s) → it falls back to MANUAL_PUBLICATIONS, and only writes what's listed there.
# So because your scrape is essentially always blocked, MANUAL_PUBLICATIONS is your real source of truth — treat it as the complete list of your papers. If you add a paper's google_scholar_id to the bib but forget to add it to MANUAL_PUBLICATIONS, its badge will read 0 (no matching row gets written on a blocked run).

# So the answer: the script handles everything automatically only on the rare occasions Google lets the scrape through; the rest of the time you add each new paper in both places. I'll make the push hook non-destructive so a blocked run never wipes anything.






# Google Scholar citation counts, read by _layouts/bib.liquid at build time and baked
# into a static shields.io badge per publication. Key: <scholar_userid>:<google_scholar_id>.
# Refresh with `python bin/update_citations_local.py` (or edit `citations:` by hand), then push.
# Must stay valid YAML — do NOT paste prose here unless every line starts with '#'.
metadata:
  last_updated: '2026-07-25'
papers:
  rNBVr8gAAAAJ:u5HHmVD_uO8C:
    citations: 3
    title: "Lung Cancer Identification from CT Scans using a Soft-attention enabled Deep Transfer Learning Model"
    year: '2025'



    Projects:
      - name: Cross-Industry Privacy-Preserving Framework for Predictive Maintenance (IDA 2024 Challenge)
        summary: >
          A federated, differentially private framework for RUL prediction on the SCANIA-X dataset. Combines numerical 
          and categorical features into transformer embeddings with a TabTransformer, applies Spectral-DP and DP-SGD, and 
          aggregates a global model across heterogeneous clients with the flwr library.
        highlights:
          - Implemented differential privacy from scratch (Spectral-DP and DP-SGD, including a Renyi DP / Moments accountant) to protect training data, with a two-stage model pairing a Transformer time-series encoder and a TabTransformer head.
          - Infused federated training via the flwr library, aggregating a global model across heterogeneous clients with different computing power, parameters, and hyperparameters to mirror real-life industrial equipment.
          - Best RUL prediction model on the dataset with an MSE of 2725 while preserving training-data privacy, achieving 49.12% AUC and 49.59% accuracy in an advanced membership inference attack.
          # - Built an advanced membership inference attack (white-box, gray-box, black-box plus time-series seasonality/trend features) achieving 49.12% AUC and 49.59% accuracy, confirming strong privacy.
        start_date: 2025-02-01
        end_date: 2025-08-01

      - name: Context-Aware Multimodal Knowledge Retrieval System
        summary: >
          A context-aware parser that automatically extracts and separately processes multimodal content (images, tables,
          equations, graphs, text) and summarises each modality into vector embeddings, then answers queries with
          comprehensive, source-cited responses referencing text, table data and image insights.
        highlights:
          - Employed modality-specific pipelines and selected the appropriate LLM per content type to improve summary quality, storing embeddings and summaries in ChromaDB using Hugging Face embeddings.
          - Runs three parallel retrieval pipelines (LLM-summary embeddings, raw-atomic content, and CLIP text-to-image search), parsing documents with Docling.
          - Designed a multi-vector retrieval strategy linking document summaries to original content, so queries retrieve the relevant multimodal content for context preservation.

      - name: SENTRAL - Multi Spectrum Stock Analysis using custom LLMs
        summary: >
          A multi-spectrum stock analysis system combining fundamental analysis (14 metrics such as P/E, P/B, Debt
          plus Piotroski F-Score and Altman Z-Score with sector peer comparisons), technical analysis
          (18 indicators such as EMA20/50), multi-LLM news sentiment, and Transformer/LSTM
          forecasting to compute buy/hold/sell probabilities.
        highlights:
          - Collected news via seven APIs plus web scraping, filtered items by relevance score, then fed the curated corpus to 10 LLMs (finance-tuned and SOTA reasoning models) for sentiment extraction and signal generation.
          - Applied Transformer and LSTM models to forecast price trends and ensembled sentiment with fundamental and technical indicators, boosting a newbie portfolio by +45% over five months.
          # - Packaged as two production-ready Streamlit apps (a deep single-stock analyzer and a screener.in-style screener) with a 20-strategy backtesting engine, Monte Carlo simulation, and report generation.

     



# Cross-Industry Privacy-Preserving Framework for Predictive Maintenance (IDA 2024 Challenge)
# A federated, differentially private framework for RUL prediction on the SCANIA-X dataset. Combines numerical and categorical features into transformer embeddings with a TabTransformer, applies Spectral-DP and DP-SGD, and aggregates a global model across heterogeneous clients with the flwr library.

# Best RUL prediction model on the dataset with an MSE of 2725 while preserving training-data privacy.
# Built an advanced membership inference attack (white-box, gray-box, black-box plus time-series features) achieving 49.12% AUC and 49.59% accuracy, confirming strong privacy.

# SENTRAL - Multi Spectrum Stock Analysis using custom LLMs
# A multi-spectrum stock analysis system combining fundamental analysis (14 metrics plus Piotroski F-Score and Altman Z-Score), technical analysis (18 indicators), news sentiment from 10 LLMs, and Transformer/LSTM forecasting to compute buy/hold/sell probabilities.

# Collected news via seven APIs plus web scraping and filtered items by relevance before LLM sentiment extraction.
# Ensembled sentiment with fundamental and technical indicators, boosting a newbie portfolio by +45% over five months.

# Context-Aware Multimodal Knowledge Retrieval System
# A retrieval system that parses and separately processes multimodal content (images, tables, equations, graphs, text), summarises each modality into embeddings stored in ChromaDB, and answers queries with source-cited, multimodal responses.

# Employed modality-specific pipelines with the most appropriate LLM per content type.
# Designed a multi-vector retrieval strategy linking summaries to original content for context preservation.
























